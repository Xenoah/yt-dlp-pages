name: Publish yt-dlp Pages UI

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'web-tests/**'
      - 'devscripts/package_pages_bridge.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read  # Read the UI sources for the static build.

concurrency:
  group: yt-dlp-pages
  cancel-in-progress: true

jobs:
  build:
    name: Test and package Pages UI
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
      - name: Test bridge and command generation
        run: |
          python -m unittest discover -s web-tests -p 'test_*.py' -v
          node --test web-tests/core.test.mjs
          node --check docs/app.js
      - name: Package local bridge
        run: python devscripts/package_pages_bridge.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: docs
  deploy:
    name: Deploy Pages UI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write  # Publish the prepared static site to GitHub Pages.
      id-token: write  # Authenticate the deployment with a short-lived OIDC token.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
